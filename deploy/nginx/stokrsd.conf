# /etc/nginx/sites-available/stokrsd.conf
# Aktifkan dengan: sudo ln -s /etc/nginx/sites-available/stokrsd.conf /etc/nginx/sites-enabled/
#
# Satu VPS, tanpa Docker: nginx jadi pintu depan (port 80/443), meneruskan
# ke dua proses lokal yang jalan lewat systemd:
#   - Next.js frontend  -> 127.0.0.1:3000  (gowms-frontend.service)
#   - Go backend Fiber   -> 127.0.0.1:8080  (gowms-backend.service)
#
# Ganti "stokrsd.example.com" dengan domain asli sebelum dipakai. Untuk
# HTTPS, jalankan `sudo certbot --nginx -d stokrsd.example.com` SETELAH
# config ini aktif dan domain sudah resolve ke VPS — certbot akan otomatis
# menyisipkan blok `listen 443 ssl` + `ssl_certificate` ke file ini.

upstream gowms_frontend {
    server 127.0.0.1:3000;
    keepalive 32;
}

upstream gowms_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name stokrsd.example.com;

    # Batas ukuran body upload (form barang/PO dengan lampiran, dsb).
    client_max_body_size 10m;

    # --- Backend REST API: semua path /stockrsd/* diteruskan ke Go/Fiber ---
    location /stockrsd/ {
        proxy_pass http://gowms_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # --- Endpoint sehat backend, untuk monitoring eksternal ---
    location /health {
        proxy_pass http://gowms_backend;
        proxy_set_header Host $host;
    }

    # --- Aset statis Next.js (_next/static) — cache lama & agresif ---
    location /_next/static/ {
        proxy_pass http://gowms_frontend;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # --- Sisanya (semua halaman) diteruskan ke Next.js ---
    location / {
        proxy_pass http://gowms_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    access_log /var/log/nginx/stokrsd.access.log;
    error_log  /var/log/nginx/stokrsd.error.log;
}
