# File ini: .github/workflows/deploy.yml  (letakkan di repo frontend wms)
#
# Mirror dari workflows/backend-deploy.yml di repo gowms — build di GitHub
# Actions, kirim hasil build ke VPS lewat SSH, restart via systemd. Tanpa
# Docker/registry, jadi tidak ada biaya container hosting.
#
# Secrets yang wajib diisi (sama seperti repo backend, boleh dipakai ulang):
#   VPS_HOST, VPS_USER, VPS_SSH_KEY, VPS_PORT (opsional, default 22)
#
# Variables (Settings > Secrets and variables > Actions > Variables):
#   NEXT_PUBLIC_API_BASE_URL   -> https://stokrsd.example.com/stockrsd
#   NEXT_PUBLIC_APP_NAME       -> StokRSD WMS
#   NEXT_PUBLIC_ENABLE_DEMO_MODE -> false

name: Deploy Frontend

on:
  push:
    branches: [main]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint .

      - name: Build production bundle
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
          NEXT_PUBLIC_APP_NAME: ${{ vars.NEXT_PUBLIC_APP_NAME }}
          NEXT_PUBLIC_ENABLE_DEMO_MODE: ${{ vars.NEXT_PUBLIC_ENABLE_DEMO_MODE }}
        run: npm run build

      # next start butuh: .next (hasil build), public, package.json,
      # node_modules produksi (next start bukan output standalone di sini).
      - name: Package artifact
        run: |
          npm prune --omit=dev
          tar -czf release.tar.gz .next public package.json package-lock.json node_modules next.config.ts

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: gowms-frontend
          path: release.tar.gz
          retention-days: 3

  deploy:
    name: Deploy to VPS
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: gowms-frontend

      - name: Install SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Add VPS to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${{ secrets.VPS_PORT || 22 }}" -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload build to VPS (staged path)
        run: |
          scp -P "${{ secrets.VPS_PORT || 22 }}" release.tar.gz \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/gowms/frontend/release.tar.gz"

      - name: Atomic swap + restart via systemd
        run: |
          ssh -p "${{ secrets.VPS_PORT || 22 }}" "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" '
            set -e
            cd /opt/gowms/frontend
            rm -rf .next.new public.new node_modules.new
            mkdir -p release-tmp && tar -xzf release.tar.gz -C release-tmp
            mv release-tmp/.next .next.new
            mv release-tmp/public public.new
            mv release-tmp/node_modules node_modules.new
            rm -rf .next.old public.old node_modules.old
            mv .next .next.old 2>/dev/null || true
            mv public public.old 2>/dev/null || true
            mv node_modules node_modules.old 2>/dev/null || true
            mv .next.new .next
            mv public.new public
            mv node_modules.new node_modules
            cp release-tmp/package.json .
            rm -rf release-tmp release.tar.gz
            sudo systemctl restart gowms-frontend
            sleep 3
            sudo systemctl is-active --quiet gowms-frontend
            curl -sf http://127.0.0.1:3000/login > /dev/null || (echo "Health check gagal!" && exit 1)
            rm -rf .next.old public.old node_modules.old
          '
